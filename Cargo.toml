[package]
name = "pheme"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
directories = "6.0.0"
env_logger = "0.11.11"
feed-rs = "3.0.0"
log = "0.4.34"
opml = "1.1.6"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query", "form", "gzip", "system-proxy"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[build-dependencies]
cxx-qt-build = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
